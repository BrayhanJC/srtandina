stages:

  clean:
    cmd: python -m src.clean
    deps:
      - data/raw/crm_extracto.csv
      - src/clean.py
      - src/common.py
    outs:
      - data/processed/clean.csv
      - reports/cleaning.json:
          cache: false # conteos por tratamiento: va a Git como evidencia

  validate:
    cmd: python -m src.validate
    deps:
      - data/processed/clean.csv
      - data/raw/crm_extracto.csv # las advertencias se evalúan sobre el crudo
      - reports/cleaning.json # regla de descarte máximo
      - contracts/churn_contract.py
      - contracts/crm_warnings.py
      - src/validate.py
    outs:
      - reports/validation.json:
          cache: false

  prepare:
    cmd: python -m src.prepare
    deps:
      - data/processed/clean.csv
      - reports/validation.json # prepare no corre si validate no terminó bien
      - src/prepare.py
    params:
      - split
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
  
  train:
    cmd: python -m src.train
    deps:
    - data/processed/train.csv
    - src/features.py
    - src/train.py
    params:
    - model
    - mlflow
    outs:
    - models/model.joblib
    - models/model_meta.json:
        cache: false

  evaluate:
    cmd: python -m src.evaluate
    deps:
    - data/processed/test.csv
    - models/model.joblib
      # model_meta.json cambia en cada entrenamiento (nueva corrida de MLflow): así la evaluación
      # siempre registra sus métricas en esa corrida, aunque el modelo resulte idéntico.
    - models/model_meta.json
    - src/evaluate.py
    params:
    - business
    - model.decision_threshold
    - gate.eval_threshold
    metrics:
    - metrics.json:
        cache: false
    plots:
    - reports/roc_curve.csv:
        x: fpr
        y: tpr
        cache: false
    outs:
    - reports/confusion_matrix.png:
        cache: false
